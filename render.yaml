services:
  - type: web
    name: hospital-app
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: hospital-db
    plan: free
    databaseName: app_db
    user: postgres
